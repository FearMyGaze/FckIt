timeout: 3
entry: Arch Linux

:Arch Linux
    protocol: linux
    kernel_path: /vmlinuz-linux
    cmdline: root=PARTUUID=ROOT_PARTUUID rw quiet loglevel=3 mitigations=off processor.max_cstate=1 intel_idle.max_cstate=1 nvme.noacpi=1 transparent_hugepage=always net.core.default_qdisc=fq net.ipv4.tcp_congestion_control=bbr i915.enable_guc=3 i915.enable_psr=1 i915.enable_fbc=1 i915.enable_dc=1 i915.disable_power_well=0
    module_path: /intel-ucode.img
    module_path: /initramfs-linux.img
    module_path: /initramfs-linux-fallback.img

:Arch Linux (fallback)
    protocol: linux
    kernel_path: /vmlinuz-linux
    cmdline: root=PARTUUID=ROOT_PARTUUID rw quiet loglevel=3
    module_path: /intel-ucode.img
    module_path: /initramfs-linux-fallback.img

:UEFI Shell
    protocol: efi
    path: /EFI/shellx64.efi

:Reboot
    protocol: reboot