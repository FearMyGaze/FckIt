# Starship configuration - F#ckIt! edition
# Catppuccin Mocha theme

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_commit\
$nodejs\
$rust\
$python\
$golang\
$docker_context\
$package\
$cmd_duration\
$line_break\
$character"""

# Username
[username]
show_always = true
format = "[$user]($style) "
style_user = "bold pink"
style_root = "bold red"
disabled = false

# Hostname
[hostname]
ssh_only = true
format = "@[$hostname]($style) "
style = "bold blue"
disabled = false

# Directory
[directory]
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only_style = "red"

# Git branch
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

# Git status
[git_status]
format = '[($conflicted$deleted$renamed$staged$untracked$modified)]($style) '
style = "bold red"
conflicted = "="
deleted = "✘"
renamed = "»"
staged = "+"
untracked = "?"
modified = "!"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

# Git commit
[git_commit]
commit_hash_length = 7
format = '[$hash]($style) '
style = "bold yellow"

# Node.js
[nodejs]
format = "via [$symbol$version]($style) "
style = "bold green"
symbol = "⬢ "

# Rust
[rust]
format = "via [$symbol$version]($style) "
style = "bold red"
symbol = "🦀 "

# Python
[python]
format = "via [$symbol$version]($style) "
style = "bold yellow"
symbol = "🐍 "
pyenv_version_name = true

# Go
[golang]
format = "via [$symbol$version]($style) "
style = "bold cyan"
symbol = "🐹 "

# Docker
[docker_context]
format = "via [$symbol$context]($style) "
style = "bold blue"
symbol = "🐳 "

# Package
[package]
format = "via [$symbol$version]($style) "
style = "bold magenta"
symbol = "📦 "

# Command duration
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

# Character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# Disable unwanted modules
[aws]
disabled = true
[azure]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[terraform]
disabled = true
[nix_shell]
disabled = true
[conda]
disabled = true
[virtualenv]
disabled = true