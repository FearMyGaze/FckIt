# TLP configuration for ThinkPad T480s
# /etc/tlp.conf

# Enable TLP
TLP_ENABLE=1

# Operation mode when no power supply can be detected: 0=bat, 1=ac
TLP_DEFAULT_MODE=1

# Operation mode select: 0=bat, 1=ac
TLP_PERSISTENT_DEFAULT=1

# Disk idle timeout (seconds)
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# SATA link power management
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

# AHCI power management
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=on

# PCIe ASPM
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersave

# CPU frequency scaling
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_MIN_FREQ_ON_AC=0
CPU_SCALING_MAX_FREQ_ON_AC=0
CPU_SCALING_MIN_FREQ_ON_BAT=0
CPU_SCALING_MAX_FREQ_ON_BAT=0

# CPU boost
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Intel P-state
CPU_HWP_DYNAMIC_BOOST_ON_AC=1
CPU_HWP_DYNAMIC_BOOST_ON_BAT=0

# Intel GPU
INTEL_GPU_RUNTIME_PM_ON_AC=on
INTEL_GPU_RUNTIME_PM_ON_BAT=on

# USB autosuspend
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_ON_BAT=1

# Audio power saving
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1

# Runtime PM for devices
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# WiFi power saving
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ThinkPad battery thresholds
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# Disable when on AC
RESTORE_THRESHOLDS_ON_BAT=1