# Environment variables for Hyprland/Wayland/Intel GPU
# Vulkan/Intel GPU (UHD 620 - Kaby Lake Gen 9.5)
env = MESA_LOADER_DRIVER_OVERRIDE,i965
env = INTEL_DEBUG,norbc
env = ANV_ENABLE_PIPELINE_CACHE,1
env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/intel_icd.x86_64.json:/usr/share/vulkan/icd.d/intel_icd.i686.json

# Wayland/Qt
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QML_DISK_CACHE_PATH,~/.cache/qml
env = QML_DISABLE_DISK_CACHE,0
env = QML_DISABLE_CACHING,0
env = QML_DISABLE_PROFILE,1
env = QML_DISABLE_PROFILING,1

# Reduce latency
env = vblank_mode,0
env = WAYLAND_DISPLAY,wayland-0

# Firefox/WebRender
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_WEBRENDER,1
env = MOZ_ACCELERATED,1

# Electron apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Java
env = _JAVA_AWT_WM_NONREPARENTING,1