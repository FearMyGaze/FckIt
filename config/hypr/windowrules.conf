# Window rules (Minflair provides defaults, these add/override)

# Doom Emacs
windowrulev2 = float, class:^(emacs)$
windowrulev2 = size 1200 800, class:^(emacs)$
windowrulev2 = center, class:^(emacs)$

# Zed
windowrulev2 = float, class:^(zed)$
windowrulev2 = size 1400 900, class:^(zed)$
windowrulev2 = center, class:^(zed)$

# Bottles
windowrulev2 = float, class:^(bottles)$
windowrulev2 = size 1000 700, class:^(bottles)$
windowrulev2 = center, class:^(bottles)$

# Wine apps
windowrulev2 = float, class:^(wine)$
windowrulev2 = float, class:^(Wine)$

# Steam
windowrulev2 = float, class:^(steam)$
windowrulev2 = size 1200 800, class:^(steam)$

# Discord
windowrulev2 = move workspace 3, class:^(discord)$

# Browser
windowrulev2 = move workspace 2, class:^(firefox)$

# Terminal dropdown
windowrulev2 = float, class:^(dropdown)$
windowrulev2 = size 100% 50%, class:^(dropdown)$
windowrulev2 = pin, class:^(dropdown)$
windowrulev2 = noinitialfocus, class:^(dropdown)$

# Settings apps
windowrulev2 = float, class:^(nwg-displays)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$