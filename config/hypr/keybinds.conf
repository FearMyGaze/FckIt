# Custom keybinds (Minflair provides defaults, these override/add)

# Editor
bind = SUPER, E, exec, zed
bind = SUPER SHIFT, E, exec, emacsclient -c -a emacs

# Terminal
bind = SUPER, RETURN, exec, kitty
bind = SUPER SHIFT, RETURN, exec, kitty --class=dropdown -o initial_window_state=fullscreen

# Browser
bind = SUPER, B, exec, firefox

# File manager
bind = SUPER, F, exec, kitty -e yazi

# App launcher (Minflair uses quickshell launcher)
bind = SUPER, SPACE, exec, qs -l

# Screenshot
bind = PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Audio
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Gaming mode toggle (Minflair has this via quickshell, but adding hyprctl binding)
bind = SUPER, G, exec, hyprctl keyword animations:enabled false; hyprctl keyword decoration:blur:enabled false; hyprctl keyword general:allow_tearing true; notify-send "Gaming Mode ON"
bind = SUPER SHIFT, G, exec, hyprctl keyword animations:enabled true; hyprctl keyword decoration:blur:enabled true; hyprctl keyword general:allow_tearing false; notify-send "Gaming Mode OFF"

# Reload configs
bind = SUPER SHIFT, R, exec, hyprctl reload
bind = SUPER SHIFT, Q, exec, qs reload

# Power menu
bind = SUPER, DELETE, exec, qs -p